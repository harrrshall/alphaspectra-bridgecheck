[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaspectra-bandtrace"
version = "0.1.0"
description = "Deterministic local model-sensor spectral conformance preflight."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "AlphaSpectra"}]
keywords = ["hyperspectral", "spectroscopy", "sensor", "model assurance", "conformance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["setuptools==83.0.0", "wheel==0.47.0"]

[project.scripts]
bandtrace = "bandtrace.cli:main"

[project.urls]
Homepage = "https://harrrshall.github.io/alphaspectra-bridgecheck/bandtrace/"
Repository = "https://github.com/harrrshall/alphaspectra-bridgecheck/tree/bandtrace-v0.1.0/bandtrace/source"
Issues = "https://github.com/harrrshall/alphaspectra-bridgecheck/issues"
Security = "https://github.com/harrrshall/alphaspectra-bridgecheck/security/advisories/new"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bandtrace = ["normative/*.md", "normative/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "release: networked reproducible-build and standalone-sdist verification",
]
