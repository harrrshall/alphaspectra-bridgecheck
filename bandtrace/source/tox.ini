[tox]
env_list =
    py310-np126
    py310-np2
    py311-np126
    py311-np2
    py312-np126
    py312-np2
isolated_build = true

[testenv]
package = wheel
deps =
    pytest>=8,<10
    np126: numpy>=1.26,<2
    np2: numpy>=2,<3
commands =
    python -c "import bandtrace, numpy; assert numpy.__version__"
    pytest -q -m "not release" tests
