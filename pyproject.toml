[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaspectra-bridgecheck"
version = "0.1.0"
description = "Physics-grounded VNIR-to-SWIR candidate generation and paired-data auditing for leaf spectra."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND LicenseRef-EcoSIS-CC-BY"
license-files = [
  "LICENSE",
  "NOTICE",
  "DATA_ATTRIBUTION.md",
  "THIRD_PARTY_NOTICES.md",
]
authors = [{name = "AlphaSpectra"}]
keywords = ["hyperspectral", "spectroscopy", "SWIR", "VNIR", "PROSPECT", "plant phenotyping"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
build = ["build>=1.2,<2"]

[project.urls]
Homepage = "https://harrrshall.github.io/alphaspectra-bridgecheck/"
Repository = "https://github.com/harrrshall/alphaspectra-bridgecheck"
Issues = "https://github.com/harrrshall/alphaspectra-bridgecheck/issues"

[project.scripts]
bridgecheck = "bridgecheck.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bridgecheck = ["model/*.json", "model/*.f64", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
