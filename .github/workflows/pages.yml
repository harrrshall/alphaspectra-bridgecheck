name: Deploy browser application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install artifact verifier
        run: python -m pip install .

      - name: Verify frozen artifact
        run: python -c "from bridgecheck.artifact import BridgeArtifact; BridgeArtifact.load()"

      - name: Reject remote executable and stylesheet dependencies
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          from urllib.parse import urlparse

          failures = []

          class Dependencies(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  candidate = None
                  if tag == "script" and values.get("src"):
                      candidate = values["src"]
                  if tag == "link" and "stylesheet" in values.get("rel", "").lower():
                      candidate = values.get("href")
                  if candidate:
                      parsed = urlparse(candidate)
                      if parsed.scheme in {"http", "https"} or parsed.netloc:
                          failures.append(candidate)

          parser = Dependencies()
          for page in Path("src/bridgecheck/static").rglob("*.html"):
              parser.feed(page.read_text(encoding="utf-8"))
          remote = r"(?:https?:)?//"
          css_dependency = re.compile(rf"(?:@import\s+(?:url\()?|url\()\s*['\"]?{remote}", re.I)
          js_dependency = re.compile(rf"(?:from\s+|import\s*\()\s*['\"]{remote}", re.I)
          for asset in Path("src/bridgecheck/static").rglob("*"):
              if not asset.is_file():
                  continue
              source = asset.read_text(encoding="utf-8")
              if asset.suffix == ".css" and css_dependency.search(source):
                  failures.append(str(asset))
              if asset.suffix in {".js", ".mjs"} and js_dependency.search(source):
                  failures.append(str(asset))
          if failures:
              raise SystemExit(f"remote executable/style dependencies are forbidden: {failures}")

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble narrow static site
        shell: bash
        run: |
          set -euo pipefail
          install -d _site/assets _site/model _site/docs
          cp -R src/bridgecheck/static/. _site/
          cp -R src/bridgecheck/static/. _site/assets/
          cp -R src/bridgecheck/model/. _site/model/
          cp MODEL_CARD.md DATA_ATTRIBUTION.md THIRD_PARTY_NOTICES.md PRIVACY.md SECURITY.md RELEASE_VERIFICATION.json _site/docs/
          test -f _site/index.html
          test -f _site/assets/app.js
          test -f _site/assets/bridge-core.js
          test -f _site/assets/styles.css
          test -f _site/model/manifest.json
          test -f _site/docs/RELEASE_VERIFICATION.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
